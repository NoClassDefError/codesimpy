# Jupyter Book 2 (MyST) project for the CodeSim documentation.
# Build:   cd docs && jupyter book build --html     -> docs/_build/html
# Preview: cd docs && jupyter book start
version: 1
project:
  title: CodeSim documentation
  description: Building device models and systems in CodeSim, and the reference of the existing ones.
  toc:
    - file: ../README.md
    - file: guide.md
    - file: components.md
    - file: systems.md
    - file: validation.md
site:
  template: book-theme
  options:
    folders: true
    logo: figures/logo.png
    logo_text: CodeSim
    favicon: figures/logo.png

