# Build the Jupyter Book in docs/ and publish it on GitHub Pages.
# Requires: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "*.png"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Jupyter Book
        run: pip install "jupyter-book>=2,<3"
      - name: Build HTML
        working-directory: docs
        env:
          # The site is served from https://<user>.github.io/<repository>/
          BASE_URL: /${{ github.event.repository.name }}
        run: jupyter book build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
